<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floorplan Drawer — Pro CAD Edition</title>
  <!-- Local JS -->
  <script src="js/svg.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top Menu Bar -->
  <div id="menu-bar">
    <div class="menu-item">File
      <div class="dropdown">
        <div class="dropdown-item" id="menu-new">New</div>
        <div class="dropdown-item" id="menu-open">Open…</div>
        <div class="dropdown-item" id="menu-import">Import XML…</div>
        <div class="dropdown-item" id="menu-save">Save XML</div>
      </div>
    </div>
    <div class="menu-item">Edit
      <div class="dropdown">
        <div class="dropdown-item" id="menu-undo">↩️ Undo (Ctrl+Z)</div>
        <div class="dropdown-item" id="menu-redo">↪️ Redo (Ctrl+Y)</div>
      </div>
    </div>
    <div class="menu-item">View
      <div class="dropdown">
        <div class="dropdown-item" id="menu-toggle-labels">✔️ Show Labels</div>
        <div class="dropdown-item" id="menu-toggle-rulers">✔️ Show Rulers</div>
      </div>
    </div>
    <div class="menu-item" id="menu-convert">View XML Code</div>
    <div class="menu-item" id="menu-clear">Clear All</div>
    <div class="menu-item" id="menu-reset-zoom">Reset View</div>
  </div>

  <input type="file" id="file-input" accept=".xml" style="display:none" />

  <!-- Modal for XML -->
  <div id="output-modal">
    <textarea id="output" readonly></textarea>
    <button id="btn-close-output">Close</button>
  </div>

  <div id="app-body">
    <!-- Sidebar Tools -->
    <div id="sidebar">
      <button id="tool-select" class="tool-btn" title="Select (👆)">👆</button>
      <button id="tool-square" class="tool-btn active" title="Rect Room (⬛)">⬛</button>
      <button id="tool-pen" class="tool-btn" title="Wall (✏️)">✏️</button>
      <button id="tool-measure" class="tool-btn" title="Measure (📏)">📏</button>
      <button id="tool-opening" class="tool-btn" title="Opening (🚪)">🚪</button>
      <div class="divider"></div>
      <button id="tool-magnet" class="tool-btn active" title="Snap (🧲)">🧲</button>
      <div class="divider"></div>
      <div class="panel">
        <label>Grid (m)
          <input type="number" id="grid-size" min="0.05" step="0.05" value="1.0" />
        </label>
        <label>Snap Threshold (px)
          <input type="number" id="snap-thresh" min="1" step="1" value="15" />
        </label>
      </div>
    </div>

    <!-- Workspace: rulers + canvas -->
    <div id="workspace">
      <div id="ruler-top-scroll"><div id="ruler-top-inner"></div></div>
      <div id="workspace-bottom">
        <div id="ruler-left-scroll"><div id="ruler-left-inner"></div></div>
        <div id="canvas-container">
          <div id="drawing-area"></div>
        </div>
      </div>
      <div id="status-bar">
        <span id="status-pos">x: 0.00m, y: 0.00m</span>
        <span id="status-zoom">Zoom: 1.00×</span>
        <span id="status-snap">Snap: On</span>
        <span id="status-angle">Angle: —</span>
      </div>
    </div>

    <!-- Properties Panel -->
    <div id="properties-panel">
      <h3>Properties</h3>
      <div class="prop-group">
        <label>Object Name</</label>
        <input type="text" id="prop-name" placeholder="Select an object…" disabled />
      </div>

      <h3>Walls Overview</h3>
      <button id="btn-link" class="linked" disabled>🔗 Dimensions Linked</button>
      <table class="wall-table" id="prop-walls">
        <thead><tr><th>Wall</th><th>Length (m)</th><th>Thick (m)</th></tr></thead>
        <tbody><tr><td colspan="3">No shape selected</td></tr></tbody>
      </table>

      <div class="apply-row">
        <button id="btn-apply" class="apply">Apply</button>
        <button id="btn-reset" class="reset">Reset</button>
      </div>
    </div>
  </div>

  <!-- App code -->
  <script src="js/app.js"></script>
</body>
</html>
